{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} · {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ taxonomy.name | capitalize }}</h1>
<ul class="terms">
  {% for term in terms %}
  <li><a href="{{ term.permalink | safe }}">{{ term.name }}</a> ({{ term.pages | length }})</li>
  {% endfor %}
</ul>
{% endblock %}
